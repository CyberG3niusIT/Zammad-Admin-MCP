[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zammad-admin-mcp"
version = "0.1.0"
description = "MCP server for reading and staging changes to Zammad administrative configuration"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp[cli]>=1.2,<2",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
zammad-admin-mcp = "zammad_admin_mcp.server:main"

[tool.setuptools.packages.find]
include = ["zammad_admin_mcp*"]
